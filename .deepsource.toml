# DeepSource analysis config — https://docs.deepsource.com/docs/platform/reference/core-analyzers
version = 1

exclude_patterns = [
  ".next/**",
  "out/**",
  "build/**",
  "node_modules/**",
  "docs/**",
  "docs/.vitepress/dist/**",
  "docs/.vitepress/cache/**",
  ".flowbite-react/**",
  "next-env.d.ts",
  "package-lock.json",
  "**/*.mjs",
  "scripts/**",
  "playwright.config.ts",
  "vitest.config.ts",
  "next.config.ts",
  "postcss.config.mjs",
  "eslint.config.mjs",
]

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "e2e/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser", "vitest"]
  dialect = "typescript"
  cyclomatic_complexity_threshold = "critical"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]
