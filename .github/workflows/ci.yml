name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 avoids the Node 20 Actions runtime deprecation warning.
      # Cache omitted on purpose: a stale npm cache can make `npm ci` fail in ~2s.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm-version must match the local npm 11 that generated package-lock.json;
      # a mismatch causes npm ci to fail in ~7s before any package is downloaded.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run bench
      # Soft-fail on purpose — transitive Next/postcss highs; see SECURITY.md.
      # Making this blocking would freeze PRs without an app-level fix path.
      - name: Dependency audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run build

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    # Smoke E2E on every PR + main push so UI regressions cannot hide until merge.
    # Full multi-viewport suite remains a local `npm run test:e2e` command.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e -- --project=desktop
